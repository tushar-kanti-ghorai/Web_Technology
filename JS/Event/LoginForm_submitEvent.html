<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../bootstrap-framework/css/bootstrap.min.css">
    <style>
        .bg-dark {
            background-color: black !important;
            color: white !important;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">🧾 Jspider</a>
        </div>
    </nav>

    <section class="container-fluid mt-5 ">
        <div class="row">
            <div class="col-5 m-auto">
                <div class="card border-dark">
                    <div class="card-header border-dark text-center bg-dark text-white">
                        Login Form
                    </div>

                    <div class="card-body">
                       <form id="form-control">
                         <div>
                            <input type="text" placeholder="Enter username" class="form-control" value="" id="userName">
                        </div >
                        <div class="mt-2">
                            <input type="password" placeholder="Enter Password" class="form-control" value="" id="passWord">
                        </div>
                        <div class="mt-2 text-center">
                            <input type="submit" class="btn btn-dark text-white ">
                        </div>
                        
                       </form>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script>
      let formEle=document.getElementById('form-control');
      let userName=document.getElementById('userName');
      let passWord=document.getElementById('passWord');

      formEle.addEventListener('submit',function(event){
      event.preventDefault();
      let form={};
      form.usn=userName.value;
      form.pass=passWord.value;
      console.log(form);
      userName.value=passWord.value='';


      });

    </script>

</body>

</html>
