<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Event Handling</h1>
<button onclick="inline();">Inline event</button>
<button id="addEvent">AddEvent</button>
<button id="evenProp">Even Properties</button>
    <script>
        function inline(){
            document.title="Inline event";

        }

        //addEventLisitener Method
        document.getElementById('addEvent').addEventListener('click',()=>{
            document.title="AddEventListener";
        })
       
        //Event properties
        let evenProp=document.getElementById('evenProp');
        evenProp.onclick=evenProperties;
        function evenProperties(){
            document.title="event Properties";
        }
    </script>


</body>
</html>
