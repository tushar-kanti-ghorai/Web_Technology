<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../bootstrap-framework/css/bootstrap.min.css">
</head>
<body>
   <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid text-white">
            <div class="navbar-brand">🧾 Jspider</div>
             <div>
              <span id="hr">00</span>:<span id="min">00</span>:<span id="sec">00</span>
             </div>

        </div>

    </nav>

    <script>
        let hrTag=document.getElementById('hr');
        let minTag=document.getElementById('min');
        let secTag=document.getElementById('sec');
        function digitalClock(){
            let date=new Date();
            let hr=date.getHours();
            let min=date.getMinutes();
            let sec=date.getSeconds();
            hrTag.innerText=(hr>9)?hr:"0"+hr;
            minTag.innerText=(min>9)?min:"0"+min;
            secTag.innerText=(sec>9)?sec:"0"+sec;
        }

        digitalClock();

        setInterval(()=>digitalClock(),1000);

    </script>

    
</body>
</html>
