<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies App</title>
  <link rel="stylesheet" href="../../bootstrap-framework/css/bootstrap.min.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid text-white">
      <div class="navbar-brand">🎥 Movie</div>
    </div>
  </nav>

  <section class="mt-3 ms-3">
    <input type="search" id="searchBox">
    <button class="btn btn-primary text-white" id="searchBtn">Submit</button>
  </section>

  <section class="container-fluid mt-3">
    <div class="row" id="movieList"></div>
  </section>

  <script type="module">
    import movies from './movieDetails.js';

    const movieList = document.getElementById("movieList");

    // Show all movies
    function displayMovies(data) {
      movieList.innerHTML = "";
      data.forEach(movie => {
        movieList.innerHTML += `
          <div class="col-3 mb-3">
            <div class="card">
              <div class="card-body">
                <h5>${movie.name}</h5>
                <p><strong>Director:</strong> ${movie.director}</p>
                <p>${movie.details}</p>
              </div>
            </div>
          </div>
        `;
      });
    }

    displayMovies(movies);

 
    document.getElementById("searchBtn").addEventListener("click", () => {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const filtered = movies.filter(m => 
        m.name.toLowerCase().includes(query)
      );
      displayMovies(filtered);
    });
  </script>
</body>
</html>
